<script>
/* ============================================================
 * 配置
 * ============================================================ */
const W = 1920, H = 1080, FPS = 30;
const BURN_IN_SUBS = false;   // false：字幕交给剪映（导入 SRT）；true：直接烧进画面
const FONT_SERIF = '"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif';
const FONT_SANS  = '"Noto Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif';
const FONT_MONO  = '"JetBrains Mono","SF Mono",Consolas,"WenQuanYi Zen Hei Mono",monospace';
// 金 = 低头 / 合作（暖）；蓝 = 硬扛 / 背叛（冷）；红 = 气话那一下
const PALETTE = { bg: '#07080c', ink: '#f2efe8', dim: '#7d7a73', gold: '#e8b45a', blue: '#5aa9e8', red: '#e06a5a' };
const RGB = { ink: '242,239,232', gold: '232,180,90', blue: '90,169,232', red: '224,106,90' };

/* ============================================================
 * 数据：全部实时计算，字幕里的数字直接取自这里
 * ============================================================ */
// 30 天，一天一回合。C = 低头，D = 硬扛。一报还一报：第一天低头，之后学对方前一天。
const DAYS = 30, HARSH_DAY = 5, FORGIVE_DAY = 7, BOW_DAY = 10;
function simDays({ harsh = null, both = false, forgive = null, bow = null, A = 'TFT', B = 'TFT' } = {}) {
  const a = [], b = [];
  for (let d = 1; d <= DAYS; d++) {
    let x = A === 'ALLC' ? 'C' : d === 1 ? 'C' : b[d - 2];
    let y = B === 'ALLD' ? 'D' : d === 1 ? 'C' : a[d - 2];
    if (d === harsh) { x = 'D'; if (both) y = 'D'; }            // 气话：一个人说 / 两个人同时说
    if (forgive && d === forgive) x = 'C';                       // 对方回嘴那天，不回
    if (bow && (d === bow || d === bow + 1)) x = 'C';            // 先低头，第二天再接住一次
    a.push(x); b.push(y);
  }
  return { a, b };
}
const made = (s, upto = DAYS, from = 1) => s.a.slice(from - 1, upto).filter((v, i) => v === 'C' && s.b[from - 1 + i] === 'C').length;
const hurt = (s, upto = DAYS) => s.a.slice(0, upto).filter((v, i) => v === 'C' && s.b[i] === 'D').length;
const ECHO      = simDays({ harsh: HARSH_DAY });                              // 第一个结：吵个没完
const ECHO_FIX  = simDays({ harsh: HARSH_DAY, forgive: FORGIVE_DAY });        // 解：回嘴那天不回
const COLD      = simDays({ harsh: HARSH_DAY, both: true });                  // 第二个结：冷个没完
const COLD_ONCE = simDays({ harsh: HARSH_DAY, both: true, forgive: BOW_DAY });// 只低头一次 → 变成吵架
const COLD_FIX  = simDays({ harsh: HARSH_DAY, both: true, bow: BOW_DAY });    // 低头 + 再接住一次
const DOORMAT   = simDays({ A: 'ALLC', B: 'ALLD' });                          // 一直低头 vs 一直硬扛

// Axelrod 比赛的收益（T=5, R=3, P=1, S=0），一报还一报和几种对手各打 200 轮
const PAY = { CC: [3, 3], CD: [0, 5], DC: [5, 0], DD: [1, 1] };
function match(opp, seed) {
  const r = rng(seed), a = [], b = []; let sa = 0, sb = 0;
  for (let i = 0; i < 200; i++) {
    const x = i ? b[i - 1] : 'C', y = opp(a, i, r);
    a.push(x); b.push(y); const [p, q] = PAY[x + y]; sa += p; sb += q;
  }
  return [sa, sb];
}
const SCORES = [
  ['永远合作', (a, i) => 'C'], ['永远背叛', () => 'D'], ['交替出招', (a, i) => i % 2 ? 'D' : 'C'],
  ['记仇', (a) => a.includes('D') ? 'D' : 'C'], ['随机', (a, i, r) => r() < 0.5 ? 'C' : 'D'], ['一报还一报', (a, i) => i ? a[i - 1] : 'C'],
].map(([name, f], k) => [name, ...match(f, 1980 + k)]);
const FIRST_STEPS = (() => { const n = 15, pairs = n * (n + 1) / 2; return pairs * 200 * 5; })();   // 15 个程序含自己两两对局，每对 200 轮，重复 5 遍

  [79.0,  '可它会打两个死结。', 'But it can tie two knots.'],

  [85.0,  'TA 回一句，你再回一句……', 'They snap back. You snap back...'],

  [116.0, `第二个结难一点。你第 ${BOW_DAY} 天先低头，`, `Knot two is harder. On day ${BOW_DAY}, you give in first,`],

  [130.0, `委屈了 ${hurt(COLD_FIX)} 天，换回 ${made(COLD_FIX, DAYS, BOW_DAY)} 天和好。`, `${hurt(COLD_FIX)} hard day, ${made(COLD_FIX, DAYS, BOW_DAY)} days at peace.`],

  [141.0, '所以先低头，不等于永远低头。', 'So giving in first is not giving in forever.'],

const CHAPTER_STARTS = [9, 31, 51, 79, 109, 134, 146];
const SUBS = SUB_LINES.map(([start, zh, en], i) => {
  const next = SUB_LINES[i + 1]?.[0] ?? 156.5;
  const cap = CHAPTER_STARTS.includes(next) ? next - 0.5 : next - 0.3;
  return { start, end: Math.min(cap, start + 4.6), zh, en };
});

 * ============================================================ */

  { t: 9,   no: '01', title: '囚徒困境' },
  { t: 31,  no: '02', title: '冷战' },
  { t: 51,  no: '03', title: '一报还一报' },

];

const rainAmount = t => Math.max(fade(t, 31, 33) * (1 - fade(t, 49, 51)), fade(t, 79, 81) * (1 - fade(t, 116, 124)) * (0.6 + 0.4 * fade(t, 92, 96)));

 * ② 镜头
 * ============================================================ */

  { // 4 矩阵变形成冷战 → 一排明天 → 未来的影子

const CELL_W = 64, CELL_H = 52, GAP = 8, CAL_W = 6 * CELL_W + 5 * GAP;
function dayCursor(t, t0, t1) { return Math.floor(DAYS * clamp((t - t0) / (t1 - t0))); }
function dayXY(x, y, d) { const i = d - 1; return [x + (i % 6) * (CELL_W + GAP), y + Math.floor(i / 6) * (CELL_H + GAP)]; }
function drawCalendar(ctx, t, x, y, sim, upto, a, { title = '', mark = null, both = false, glow = [], copy = 0, stats = false, big = 0, tag = null } = {}) {
  if (a <= 0) return;
  // 挂着的日历纸
  ctx.save(); ctx.globalAlpha = a;
  roundRect(ctx, x - 24, y - 92, CAL_W + 48, 5 * (CELL_H + GAP) + 120, 10); ctx.fillStyle = 'rgba(18,22,32,0.88)'; ctx.fill();
  ctx.strokeStyle = 'rgba(242,239,232,0.12)'; ctx.stroke();
  ctx.fillStyle = 'rgba(242,239,232,0.35)';
  for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(x + 20 + k * 76, y - 92, 5, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  text(ctx, title, x + CAL_W / 2, y - 52, 26, PALETTE.ink, a, FONT_SANS, 2);
  textL(ctx, '你', x - 14 + CAL_W + 40, y + 12, 18, PALETTE.dim, a * 0.8, FONT_SANS);
  textL(ctx, 'TA', x - 14 + CAL_W + 40, y + 38, 18, PALETTE.dim, a * 0.8, FONT_SANS);
  for (let d = 1; d <= DAYS; d++) {
    const [cx, cy] = dayXY(x, y, d);
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(242,239,232,0.10)'; ctx.strokeRect(cx + 0.5, cy + 0.5, CELL_W - 1, CELL_H - 1);
    if (d <= upto) {
      const fresh = d === upto ? 1 : 0.85;
      ctx.globalAlpha = a * fresh;
      ctx.fillStyle = sim.a[d - 1] === 'C' ? PALETTE.gold : PALETTE.blue; ctx.fillRect(cx + 3, cy + 3, CELL_W - 6, CELL_H / 2 - 4);
      ctx.fillStyle = sim.b[d - 1] === 'C' ? PALETTE.gold : PALETTE.blue; ctx.fillRect(cx + 3, cy + CELL_H / 2 + 1, CELL_W - 6, CELL_H / 2 - 4);
    }
    ctx.restore();
    text(ctx, String(d), cx + CELL_W - 12, cy + 11, 13, d <= upto ? '#07080c' : PALETTE.dim, a * 0.9, FONT_SANS);
    if (d === mark && upto >= d) {
      ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = PALETTE.red; ctx.lineWidth = 3; ctx.strokeRect(cx - 2, cy - 2, CELL_W + 4, CELL_H + 4); ctx.restore();
    }
    if (glow.includes(d) && upto >= d) glowRect(ctx, cx, cy, CELL_W, CELL_H / 2, PALETTE.gold, a * (0.6 + 0.4 * Math.sin(t * 6)));
  }
  // 「学对方」：TA 的今天 → 你的明天，你的今天 → TA 的明天
  if (copy > 0) {
    ctx.save(); ctx.globalAlpha = a * copy * 0.9; ctx.strokeStyle = PALETTE.ink; ctx.fillStyle = PALETTE.ink; ctx.lineWidth = 1.5;
    for (let d = 7; d <= 11; d++) {
      const [x0, y0] = dayXY(x, y, d), [x1, y1] = dayXY(x, y, d + 1);
      arrow(ctx, x0 + CELL_W - 8, y0 + CELL_H * 0.75, x1 + 8, y1 + CELL_H * 0.25, copy);
      arrow(ctx, x0 + CELL_W - 8, y0 + CELL_H * 0.25, x1 + 8, y1 + CELL_H * 0.75, copy);
    }
    ctx.restore();
  }
  if (stats) {
    const sy = y + 5 * (CELL_H + GAP) + 50, s = 1 + 0.5 * big;
    text(ctx, `和好 ${made(sim, upto)} 天`, x + CAL_W / 2 - 110, sy, 30, PALETTE.gold, a, FONT_SANS, 2);
    text(ctx, `你委屈 ${hurt(sim, upto)} 天`, x + CAL_W / 2 + 110 + 40 * big, sy + 30 * big, 30 * s, PALETTE.blue, a, FONT_SANS, 2);
  }
  if (tag && tag[1] > 0) text(ctx, tag[0], x + CAL_W / 2, y + 5 * (CELL_H + GAP) + 100, 28, PALETTE.red, a * tag[1], FONT_SANS, 2);
}
function wallRoom(ctx, t, a) {                                            // 墙、窗、挂钟、飘落的日历页
  if (a <= 0) return;
  const day = clamp((t - 79) / (134 - 79)) * 30;                         // 这面墙上，30 天从镜头 7 流到镜头 9
  // 窗框投在墙上的光斑，从左扫到右；每天明暗呼吸一次
  const sweep = (day / 30), breathe = 0.5 + 0.5 * Math.cos(day * Math.PI * 2);
  ctx.save(); ctx.globalAlpha = a * (0.05 + 0.06 * breathe);
  ctx.fillStyle = `rgb(${lerpRGB([170, 200, 240], [240, 200, 140], warmth(t))})`;
  const lx = 100 + sweep * 1300;
  ctx.beginPath(); ctx.moveTo(lx, 140); ctx.lineTo(lx + 300, 140); ctx.lineTo(lx + 420, 900); ctx.lineTo(lx + 120, 900); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = a * 0.6 * (0.05 + 0.06 * breathe); ctx.fillStyle = '#000';
  ctx.fillRect(lx + 140 + 0.15 * 0, 140, 10, 760);                       // 窗棂的影子
  ctx.restore();
  // 窗户（右上角）
  const wx = 1600, wy = 120, ww = 250, wh = 360;
  ctx.save(); ctx.globalAlpha = a * 0.7; ctx.strokeStyle = 'rgba(242,239,232,0.25)'; ctx.lineWidth = 3;
  ctx.strokeRect(wx, wy, ww, wh); line(ctx, wx + ww / 2, wy, wx + ww / 2, wy + wh); line(ctx, wx, wy + wh / 2, wx + ww, wy + wh / 2);
  ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
  ctx.fillStyle = 'rgba(30,40,60,0.5)'; ctx.fillRect(wx, wy, ww, wh);
  const rr = rng(Math.floor(t * 12));
  ctx.strokeStyle = 'rgba(160,190,230,0.35)'; ctx.lineWidth = 1;
  for (let i = 0; i < 40 * rainAmount(t); i++) { const x = wx + rr() * ww, y = wy + rr() * wh; line(ctx, x, y, x - 6, y + 24); }
  ctx.restore();
  // 挂钟（左上角）：时针跟着天数转
  const kx = 190, ky = 220, kr = 70;
  ctx.save(); ctx.globalAlpha = a * 0.7; ctx.strokeStyle = 'rgba(242,239,232,0.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(kx, ky, kr, 0, Math.PI * 2); ctx.stroke();
  for (let k = 0; k < 12; k++) { const g = k * Math.PI / 6; line(ctx, kx + 58 * Math.cos(g), ky + 58 * Math.sin(g), kx + 66 * Math.cos(g), ky + 66 * Math.sin(g)); }
  const hA = day * Math.PI * 2 - Math.PI / 2, mA = day * Math.PI * 24 - Math.PI / 2;
  ctx.lineWidth = 4; line(ctx, kx, ky, kx + 36 * Math.cos(hA), ky + 36 * Math.sin(hA));
  ctx.lineWidth = 2; line(ctx, kx, ky, kx + 56 * Math.cos(mA), ky + 56 * Math.sin(mA));
  ctx.restore();
  // 撕下的日历页像落叶一样飘落
  for (let i = 0; i < 14; i++) {
    const r = rng(500 + i), born = 80 + r() * 50, life = 7, k = (t - born) / life;
    if (k < 0 || k > 1) continue;
    const x = 200 + r() * 1500 + 80 * Math.sin(k * 6 + i), y = -40 + k * (H + 80), rot = k * 6 * (r() - 0.5);
    ctx.save(); ctx.globalAlpha = a * 0.22 * Math.sin(k * Math.PI); ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = PALETTE.ink; ctx.fillRect(-18, -14, 36, 28); ctx.restore();
  }
}

/* ---------- 镜头 11：城市夜景 ---------- */
const CITY_BASE = 900;
const BUILDINGS = (() => {                                                 // 楼的位置和高度只算一次
  const r = rng(2026), list = []; let x = 0;
  while (x < W) { const bw = 90 + r() * 140, bh = 260 + r() * 520; list.push({ x, bw, bh }); x += bw + 6; }
  return list;
})();
function windowOn(targetX) {                                               // 在离 targetX 最近的高楼上取一扇窗
  const b = BUILDINGS.filter(b => b.bh > 520).sort((p, q) => Math.abs(p.x + p.bw / 2 - targetX) - Math.abs(q.x + q.bw / 2 - targetX))[0];
  const cols = Math.floor((b.bw - 34) / 26), rows = Math.floor((b.bh - 50) / 34);
  return [b.x + 14 + Math.floor(cols / 2) * 26, CITY_BASE - b.bh + 30 + Math.floor(rows / 3) * 34];
}
const W1 = windowOn(560), W2 = windowOn(1380);                            // 两扇会亮的窗
function city(ctx, t, a) {
  if (a <= 0) return;
  const r = rng(77);
  for (const { x, bw, bh } of BUILDINGS) {
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(14,16,24,0.95)'; ctx.fillRect(x, CITY_BASE - bh, bw, bh); ctx.restore();
    for (let wy = CITY_BASE - bh + 30; wy < CITY_BASE - 20; wy += 34) for (let wx = x + 14; wx < x + bw - 20; wx += 26) {
      const lit = r() < 0.18 && !((wx === W1[0] && wy === W1[1]) || (wx === W2[0] && wy === W2[1]));
      ctx.save(); ctx.globalAlpha = a * (lit ? 0.35 : 0.06); ctx.fillStyle = lit ? `rgba(${RGB.blue},1)` : PALETTE.ink;
      ctx.fillRect(wx, wy, 12, 18); ctx.restore();
    }
  }
  // bokeh 暖色光斑
  for (let i = 0; i < 26; i++) {
    const br = rng(900 + i), bx = br() * W, by = br() * 600, rad = 20 + br() * 60;
    ctx.save(); ctx.globalAlpha = a * 0.06 * (0.6 + 0.4 * Math.sin(t * 0.8 + i)); ctx.fillStyle = PALETTE.gold;
    ctx.beginPath(); ctx.arc(bx + Math.sin(t * 0.2 + i) * 20, by, rad, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  const l1 = fade(t, 147.0, 147.8), l2 = fade(t, 148.8, 149.6), join = ease(fade(t, 150.0, 152.5));
  for (const [[wx, wy], l] of [[W1, l1], [W2, l2]]) {
    if (l <= 0) continue;
    ctx.save(); ctx.globalAlpha = a * l; ctx.shadowColor = PALETTE.gold; ctx.shadowBlur = 40; ctx.fillStyle = PALETTE.gold;
    ctx.fillRect(wx, wy, 12, 18); ctx.restore();
  }
  if (join > 0) {
    ctx.save(); ctx.globalAlpha = a * 0.8; ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 2;
    const mx = (W1[0] + W2[0]) / 2 + 6, my = Math.min(W1[1], W2[1]) - 260;
    ctx.beginPath(); ctx.moveTo(W1[0] + 6, W1[1]);
    const k = join, steps = 60;
    for (let s = 1; s <= steps * k; s++) {
      const u = s / steps, x = (1 - u) * (1 - u) * (W1[0] + 6) + 2 * (1 - u) * u * mx + u * u * (W2[0] + 6);
      const y = (1 - u) * (1 - u) * W1[1] + 2 * (1 - u) * u * my + u * u * W2[1];
      ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  }
}

/* ---------- 章节卡 + 顶部进度条 ---------- */
function chapterLayer(t) {
  const ch = [...CHAPTERS].reverse().find(c => t >= c.t);
  if (ch && t < 146) {
    const local = t - ch.t, k = fade(local, 0, 0.4), move = ease(fade(local, 1.0, 1.6));
    const x = lerp(MX, 150, move), y = lerp(470, 110, move), s = lerp(1, 0.38, move);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const al = k * (move < 1 ? 1 : 0.7);
    text(ctx, ch.no, 0, -70, 96, PALETTE.gold, al, FONT_SERIF, 8, move > 0.5 ? 'left' : 'center');
    text(ctx, ch.title, 0, 40, 80, PALETTE.ink, al, FONT_SERIF, 12, move > 0.5 ? 'left' : 'center');
    ctx.restore();
  }
  // 顶部细进度条
  const x0 = 360, x1 = W - 360, y = 46;
  ctx.save(); ctx.globalAlpha = 0.5 * fade(t, 9, 10) * (1 - fade(t, 155, 156));
  ctx.fillStyle = 'rgba(242,239,232,0.15)'; ctx.fillRect(x0, y, x1 - x0, 2);
  ctx.fillStyle = PALETTE.gold; ctx.fillRect(x0, y, (x1 - x0) * clamp(t / 146), 2);
  ctx.restore();
  for (const c of CHAPTERS) {
    const cx = x0 + (x1 - x0) * c.t / 146, past = t >= c.t;
    glowDot(ctx, cx, y + 1, 3, past ? PALETTE.gold : 'rgba(242,239,232,0.4)', 0.6 * fade(t, 9, 10) * (1 - fade(t, 155, 156)));
    text(ctx, c.title, cx, y + 22, 14, past ? PALETTE.ink : PALETTE.dim, 0.45 * fade(t, 9, 10) * (1 - fade(t, 155, 156)), FONT_SANS, 1);
  }
}

/* ---------- 全局背景层 ---------- */
function background(t) {
  const w = warmth(t);
  const c = lerpRGB([18, 22, 36], [40, 28, 18], w);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, H);
  g.addColorStop(0, `rgb(${c})`); g.addColorStop(1, PALETTE.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 漂浮的尘埃
  const dr = rng(7);
  for (let i = 0; i < 90; i++) {
    const x = (dr() * W + t * (6 + dr() * 10)) % W, y = (dr() * H - t * (3 + dr() * 6) + H * 10) % H;
    ctx.save(); ctx.globalAlpha = 0.10 + 0.08 * Math.sin(t + i);
    ctx.fillStyle = `rgb(${lerpRGB([150, 180, 230], [240, 200, 140], w)})`;
    ctx.beginPath(); ctx.arc(x, y, 1.2 + (i % 3) * 0.6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // 墙面：日历那三段
  wallRoom(ctx, t, fade(t, 79, 80.5) * (1 - fade(t, 133, 134)));
  // 细雨
  const rain = rainAmount(t);
  if (rain > 0) {
    const rr = rng(Math.floor(t * FPS) * 7 + 3);
    ctx.save(); ctx.strokeStyle = 'rgba(160,190,230,1)'; ctx.lineWidth = 1;
    for (let i = 0; i < 160 * rain; i++) {
      const x = rr() * (W + 200), y = rr() * H;
      ctx.globalAlpha = 0.05 + 0.08 * rr(); line(ctx, x, y, x - 14, y + 46);
    }
    ctx.restore();
  }
}

/* ============================================================
 * 引擎
 * ============================================================ */
const DURATION = END;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function clamp(x, a = 0, b = 1) { return Math.min(b, Math.max(a, x)); }
function fade(x, a, b) { return clamp((x - a) / (b - a)); }               // a→b 之间 0→1
function ease(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function lerp(a, b, k) { return a + (b - a) * k; }
function lerpRGB(c0, c1, k) { return c0.map((v, i) => Math.round(lerp(v, c1[i], k))).join(','); }
function rng(seed) {                                                        // 确定性随机数：同一帧永远同一结果
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; };
}
function text(ctx, s, x, y, size, color, alpha = 1, font = FONT_SANS, spacing = 0, align = 'center') {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${spacing}px`;
  ctx.fillText(s, x, y); ctx.restore();
}
function textL(ctx, s, x, y, size, color, alpha = 1, font = FONT_SANS) { text(ctx, s, x, y, size, color, alpha, font, 0, 'left'); }
function line(ctx, x0, y0, x1, y1) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function arrow(ctx, x0, y0, x1, y1, k = 1) {                               // k：箭头生长进度 0→1
  const x = x0 + (x1 - x0) * k, y = y0 + (y1 - y0) * k, ang = Math.atan2(y1 - y0, x1 - x0);
  line(ctx, x0, y0, x, y);
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - 12 * Math.cos(ang - 0.4), y - 12 * Math.sin(ang - 0.4));
  ctx.lineTo(x - 12 * Math.cos(ang + 0.4), y - 12 * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fill();
}
function glowDot(ctx, x, y, r, color, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = color; ctx.shadowBlur = r * 6;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function glowRect(ctx, x, y, w, h, color, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h); ctx.restore();
}
function footnote(ctx, s, a) { text(ctx, s, MX, 880, 22, PALETTE.dim, a * 0.8, FONT_SANS, 1); }
function drawSubtitle(t) {
  const s = SUBS.find(s => t >= s.start && t < s.end);
  if (!s) return;
  const a = fade(t, s.start, s.start + 0.25) * (1 - fade(t, s.end - 0.25, s.end));
  text(ctx, s.zh, W / 2, H - 120, 44, PALETTE.ink, a, FONT_SANS, 2);
  text(ctx, s.en, W / 2, H - 66, 24, PALETTE.dim, a, FONT_SANS);
}
function filmLook(t) {                                                       // 暗角 + 胶片颗粒，统一“电影感”
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.9);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = rng(Math.floor(t * FPS) + 1);
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (let i = 0; i < 1400; i++) ctx.fillRect(r() * W, r() * H, 1.5, 1.5);
}
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; background(t);
  for (const s of SHOTS) if (t >= s.start && t < s.end) s.draw(ctx, fade(t, s.start, s.end), t, t - s.start);
  chapterLayer(t);
  if (BURN_IN_SUBS) drawSubtitle(t);
  filmLook(t);
}

// 供 render.mjs 调用
window.__vibe = { W, H, FPS, DURATION, SUBS, SHOTS: SHOTS.map(({ start, end }) => ({ start, end })), renderFrame };

// 预览模式
if (new URLSearchParams(location.search).has('render')) {
  document.body.classList.add('render');
  renderFrame(0);
} else {
  const hud = document.getElementById('hud');
  let playing = true, t = 0, last = performance.now();
  addEventListener('keydown', e => {
    if (e.code === 'Space') playing = !playing;
    if (e.code === 'ArrowRight') t = Math.min(DURATION, t + 1);
    if (e.code === 'ArrowLeft') t = Math.max(0, t - 1);
    if (e.code === 'Home') t = 0;
  });
  (function loop(now) {
    if (playing) t += (now - last) / 1000;
    if (t >= DURATION) t = 0;
    last = now;
    renderFrame(t); if (!BURN_IN_SUBS) drawSubtitle(t);  // 预览时总是显示字幕方便对稿
    hud.textContent = `${t.toFixed(2)}s / ${DURATION}s   [空格] 播放/暂停  [← →] ±1s`;
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>
</body>
</html>
